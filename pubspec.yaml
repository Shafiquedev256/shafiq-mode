name: shafiq_mode
description: Offline-first, privacy-first music player with YouTube audio downloads.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  youtube_explode_dart: ^2.3.5
  http: ^1.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0B0B12"
  adaptive_icon_foreground: assets/icon/icon_fg.png

flutter:
  uses-material-design: true
